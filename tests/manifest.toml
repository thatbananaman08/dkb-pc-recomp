# The tests tools/test.py runs. One [[test]] per check:
#
#   name           unique, used on the command line and for build/test/runner/<name>/
#   tier           0 Python only, 1 host toolchain, 2 Vulkan device, 3 your dump or your build, 4 scripted game runs
#   area           cpu, os, audio, nvn, geometry, descriptors, shaders, gfx, tools, installer
#   cmd            argv, run from the repository root. {tool} placeholders are tools found by test.py (--tools lists
#                  them); a test whose tools are missing is skipped with the reason. {out} is the test's own output folder
#                  (removed before the run; the test creates it), {root} the repository root, {gpu_name} the first Vulkan 1.3 device's name (implies a GPU).
#   needs          optional: extra tools the test finds by itself (it is skipped without them), or "gpu"
#   platform       optional: "windows" or "linux"
#   timeout        optional, seconds (default 600)
#   exclusive      optional: run alone, after the parallel tests (default: true for GPU tests)
#   known_failure  optional: why it fails today. It is reported as XFAIL and does not fail the run; remove the line once
#                  the test passes (the runner reports it as XPASS).

